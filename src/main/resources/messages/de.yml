  check-disabled: "<prefix_eco> <gray>Update-Prüfung <green><bold>deaktiviert</bold></green><gray>."

# ── Balance ───────────────────────────────────────────────────────────────────
balance:
  own: "<prefix_eco> <gray>Dein <green><bold><currency></bold></green><gray>-Guthaben: <green><bold><amount></bold></green><gray>."
  other: "<prefix_eco> <gray><green><bold><player></bold></green><gray>s <green><bold><currency></bold></green><gray>-Guthaben: <green><bold><amount></bold></green><gray>."

# ── Economy Admin ─────────────────────────────────────────────────────────────
eco:
  set: "<prefix_eco> <gray>Das <green><bold><currency></bold></green><gray>-Guthaben von <green><bold><player></bold></green> <gray>wurde auf <green><bold><amount></bold></green> <gray>gesetzt."
  give: "<prefix_eco> <gray><green><bold><amount></bold></green> <green><bold><currency></bold></green> <gray>an <green><bold><player></bold></green> <gray>gegeben."
  take: "<prefix_eco> <gray><green><bold><amount></bold></green> <green><bold><currency></bold></green> <gray>von <green><bold><player></bold></green> <gray>entnommen."
  reset: "<prefix_eco> <gray>Das <green><bold><currency></bold></green><gray>-Guthaben von <green><bold><player></bold></green> <gray>wurde auf den Standardwert zurückgesetzt."
  max-balance: "<prefix_eco> <gray>Dieser Betrag würde das maximale Guthaben für <green><bold><currency></bold></green> <gray>überschreiten."

# ── Currency ──────────────────────────────────────────────────────────────────
currency:
  added: "<prefix_eco> <gray>Währung <green><bold><currency></bold></green> <gray>wurde erstellt."
  removed: "<prefix_eco> <gray>Währung <green><bold><currency></bold></green> <gray>wurde entfernt."
  already-exists: "<prefix_eco> <gray>Währung <green><bold><currency></bold></green> <gray>existiert bereits."
  not-found: "<prefix_eco> <gray>Währung <green><bold><currency></bold></green> <gray>existiert nicht."
  config-protected: "<prefix_eco> <gray>Währung <green><bold><currency></bold></green> <gray>ist in der Konfiguration definiert und kann hier nicht entfernt werden."
  list-header: "<dark_aqua>── <aqua>Währungen</aqua> ──"
  list-entry: "<dark_gray> • <green><bold><name></bold></green> <dark_gray>(<gray><display></gray><dark_gray>)"
  list-empty: "<prefix_eco> <gray>Keine Währungen definiert."

# ── Pay ───────────────────────────────────────────────────────────────────────
pay:
  sent: "<prefix_eco> <gray><green><bold><amount></bold></green> <green><bold><currency></bold></green> <gray>an <green><bold><player></bold></green> <gray>gesendet."
  received: "<prefix_eco> <gray><green><bold><player></bold></green> <gray>hat dir <green><bold><amount></bold></green> <green><bold><currency></bold></green> <gray>geschickt."
  insufficient-funds: "<prefix_eco> <gray>Du hast nicht genug <green><bold><currency></bold></green><gray>."
  self-pay: "<prefix_eco> <gray>Du kannst nicht an dich selbst zahlen."
  min-amount: "<prefix_eco> <gray>Die Mindestzahlung beträgt <green><bold><amount></bold></green><gray>."
  tax-info: "<prefix_eco> <gray>(Eine Steuer von <green><bold><tax></bold></green> <gray>wurde von deiner Zahlung abgezogen.)"

# ── Baltop ────────────────────────────────────────────────────────────────────
baltop:
  header: "<dark_aqua>── <aqua>Top-Guthaben</aqua> · <green><bold><currency></bold></green> <dark_aqua>──"
  entry: "<dark_gray> <rank>. <green><bold><player></bold></green> <dark_gray>— <green><bold><amount></bold></green>"
  footer: "<dark_aqua>── <gray>Seite <green><bold><page></bold></green><gray>/<green><bold><pages></bold></green> <dark_aqua>──"
  empty: "<prefix_eco> <gray>Keine Guthabensdaten für <green><bold><currency></bold></green><gray>."
  invalid-page: "<prefix_eco> <gray>Ungültige Seitenzahl."
