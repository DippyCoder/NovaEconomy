# ── General ───────────────────────────────────────────────────────────────────
general:
  no-permission: "<prefix_eco> <gray>Du hast keine Berechtigung dazu."
  player-only: "<prefix_eco> <gray>Nur Spieler können diesen Befehl verwenden."
  player-not-found: "<prefix_eco> <gray>Spieler <green><bold><player></bold></green> <gray>wurde nicht gefunden."
  invalid-number: "<prefix_eco> <gray><green><bold><value></bold></green> <gray>ist keine gültige Zahl."
  invalid-args: "<prefix_eco> <gray>Verwendung: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_eco> <gray>Dieser Befehl ist derzeit deaktiviert."
  reload-done: "<prefix_eco> <gray>Plugin erfolgreich neu geladen."

